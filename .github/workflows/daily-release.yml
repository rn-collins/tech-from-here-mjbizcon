name: Daily release rebuild

# Runs at 00:07 in Hawaii (10:07 UTC) so a piece whose releasedAt is today
# goes live on its day. Vercel deploys main on every push, so the redeploy
# goes through the existing Git setup: an empty commit on release days only.
# If a VERCEL_DEPLOY_HOOK_URL secret is set, that hook is used instead.
on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node scripts/release-day.mjs
      - name: Build and test before redeploying
        if: steps.check.outputs.due == 'true'
        run: npm run build && npm test
      - name: Redeploy
        if: steps.check.outputs.due == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Release day rebuild ${{ steps.check.outputs.today }}"
            git push
          fi
